# 1. 强制 HTTP 跳 HTTPS
server {
    listen 80;
    server_name yuqi.red-magic.cn;
    return 301 https://$host$request_uri;
}

# 2. HTTPS 核心服务
server {
    listen 443 ssl;
    server_name yuqi.red-magic.cn;

    # 复用通配符证书
    ssl_certificate     /etc/nginx/ssl/red-magic.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/red-magic.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 200M;

    # Vite 前端 (dev / preview 都在 8040)
    location / {
        proxy_pass http://127.0.0.1:8040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # PocketBase API: 前端统一走 /__pb 前缀, 剥掉前缀转发到 7040
    # (PocketBase 路由注册在 /api/*, 见 pocketbase/pb_hooks/*.pb.js)
    location /__pb/ {
        rewrite ^/__pb/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:7040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
