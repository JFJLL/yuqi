# 1. 强制 HTTP 跳 HTTPS
server {
    listen 80;
    server_name yuqi.red-magic.cn;
    return 301 https://$host$request_uri;
}

# 2. HTTPS 核心服务
server {
    listen 443 ssl;
    server_name yuqi.red-magic.cn;

    # 复用通配符证书
    ssl_certificate     /etc/nginx/ssl/red-magic.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/red-magic.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

   client_max_body_size 200M;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 前端静态资源托管
    location / {
        root /home/red/work/moneyboost/yuqi/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        # index.html 禁止长期缓存 (SPA 更新依赖它)
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
    }

    # 静态资源 (带内容 hash) 长期缓存
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        root /home/red/work/moneyboost/yuqi/dist;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }    # PocketBase API: 前端统一走 /__pb 前缀, 剥掉前缀转发到 7040
    # (PocketBase 路由注册在 /api/*, 见 pocketbase/pb_hooks/*.pb.js)
    # 建议限制管理控制台: 以下 location 仅允许内网/白名单 IP, 按需取消注释
    # location /_/ {
    #     allow 10.0.0.0/8;
    #     allow 172.16.0.0/12;
    #     deny all;
    #     proxy_pass http://127.0.0.1:7040;
    # }
    location /__pb/ {
        rewrite ^/__pb/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:7040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # 浏览器仅访问 Yuqi 本机网关；网关再经 frp 回环地址调用 ASR。
    # 禁止把 ASR 服务端口或 frp 云端回环端口暴露为公开 Nginx location。
    location /__asr/ {
        rewrite ^/__asr/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:18084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
