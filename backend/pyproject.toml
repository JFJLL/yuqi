[project]
name = "yuqi-backend"
version = "0.1.0"
description = "智能工牌销售合规系统 · 一期后端 (FastAPI + PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.2",
    "httpx>=0.27.0",
    "arq>=0.26.0",
    "redis>=5.0.0",
    "orjson>=3.10.0",
    "email-validator>=2.1.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "fakeredis>=2.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "postgresql: 需要真实 PostgreSQL 的集成测试 (本机无 PG 时自动 skip)",
    "redis: 需要真实 Redis 的集成测试 (本机无 Redis 时自动 skip)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
# B008: FastAPI 标准写法 (Query/Depends 默认参数) 属误报
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
